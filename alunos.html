<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta name="theme-color" content="#5b54e8">
    <meta property="og:title" content="IncluiEdu | Alunos">
    <meta property="og:description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/professora-ajudando-aluno.jpg">
    <title>IncluiEdu | Alunos</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body data-pagina="alunos">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header class="dashboard-header">
    <a href="index.html" class="logo" aria-label="IncluiEdu - página inicial"><span>Inclui</span>Edu</a>
    <div class="usuario-menu">
        <a class="usuario-chip" href="configuracoes.html" title="Configurações"><span class="usuario-avatar" aria-hidden="true">👩‍🏫</span><span data-nome-usuario>Professor</span></a>
        <button type="button" onclick="sair()">Sair</button>
    </div>
</header>

<div class="dashboard">

    <aside class="sidebar" aria-label="Menu do professor">
        <a href="dashboard-professor.html">🏠 Dashboard</a>
        <a class="ativo" aria-current="page" href="alunos.html">👨‍🎓 Alunos</a>
        <a href="atividades.html">📝 Atividades</a>
        <a href="adaptar-atividade.html">🧩 Adaptações</a>
        <a href="resultados.html">📊 Resultados</a>
        <a href="materias.html">📚 Matérias</a>
        <a href="conteudos.html">💡 Conteúdos</a>
        <a href="configuracoes.html">⚙️ Configurações</a>
    </aside>

    <main class="dashboard-content" id="conteudo">
        <div class="dashboard-title">
            <div>
                <span>GESTÃO DE ALUNOS</span>
                <h1>Alunos</h1>
                <p>Cadastre, edite e acompanhe o perfil de aprendizagem de cada aluno.</p>
            </div>
            
        </div>

        <section class="dashboard-card">
            <h2 id="tituloFormAluno">Cadastrar aluno</h2>
            <form id="formAluno" class="form-grid">
                <input type="hidden" id="alunoId">
                <div><label for="nomeAluno">Nome do aluno</label><input type="text" id="nomeAluno" required placeholder="Nome completo"></div>
                <div><label for="turmaAluno">Turma</label><input type="text" id="turmaAluno" required placeholder="Ex.: 5º Ano A"></div>
                <div class="col-2"><label for="caracteristicasAluno">Características de aprendizagem</label>
                <textarea id="caracteristicasAluno" rows="3" placeholder="Ex.: TDAH, perde o foco em textos longos; dislexia; baixa visão; TEA..."></textarea></div>
                <div class="col-2"><label for="recursosAluno">Recursos que facilitam o aprendizado</label>
                <textarea id="recursosAluno" rows="2" placeholder="Ex.: apoio visual, áudio, instruções curtas, tempo adicional"></textarea></div>
                <div class="col-2 botoes-linha">
                    <button class="btn" type="submit" id="btnSalvarAluno">Cadastrar aluno</button>
                    <button class="btn-outline" type="button" id="btnCancelarAluno" hidden>Cancelar edição</button>
                </div>
            </form>
        </section>

        <section class="dashboard-card">
            <div class="card-header"><h2>Alunos cadastrados <small id="contagemAlunos"></small></h2>
                <label for="buscaAluno" class="sr-only">Buscar aluno</label>
                <input type="search" id="buscaAluno" class="busca" placeholder="🔎 Buscar por nome ou turma">
            </div>
            <div id="listaAlunos"></div>
        </section>
    </main>

</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/dados.js"></script>
<script src="assets/js/visual.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
