<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta name="theme-color" content="#5b5bd6">
    <meta property="og:title" content="IncluiEdu | Nova atividade">
    <meta property="og:description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/professora-ajudando-aluno.jpg">
    <title>IncluiEdu | Nova atividade</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header class="dashboard-header">
    <a href="index.html" class="logo" aria-label="IncluiEdu - página inicial"><span>Inclui</span>Edu</a>
    <a href="atividades.html">← Voltar</a>
</header>

<main class="form-page" id="conteudo">
    <section class="dashboard-card">
        <span>NOVA ATIVIDADE</span>
        <h1>Criar atividade</h1>
        <p>Cadastre a atividade original antes de realizar adaptações.</p>

        <form id="formAtividade" class="form-grid">
            <div class="form-full">
                <label for="tituloAtividade">Título da atividade</label>
                <input type="text" id="tituloAtividade" placeholder="Ex.: Frações com pizza" required>
            </div>
            <div>
                <label for="disciplinaAtividade">Disciplina</label>
                <input type="text" id="disciplinaAtividade" placeholder="Matemática" required list="listaDisciplinas">
                <datalist id="listaDisciplinas">
                    <option value="Matemática"><option value="Língua Portuguesa"><option value="Ciências">
                    <option value="História"><option value="Geografia"><option value="Arte"><option value="Inglês">
                </datalist>
            </div>
            <div>
                <label for="turmaAtividade">Ano/Turma</label>
                <input type="text" id="turmaAtividade" placeholder="5º Ano A" required>
            </div>
            <div class="form-full">
                <label for="objetivoAtividade">Objetivo da atividade</label>
                <textarea id="objetivoAtividade" rows="3" placeholder="O que o aluno deverá aprender?"></textarea>
            </div>
            <div class="form-full">
                <label for="conteudoAtividade">Conteúdo da atividade</label>
                <textarea id="conteudoAtividade" rows="8" placeholder="Digite ou cole aqui a atividade original..." required></textarea>
                <p class="dica">Dica: escreva cada pergunta como uma frase. O IncluiEdu transforma cada frase em uma etapa.</p>
            </div>
            <div class="form-full">
                <button class="btn" type="submit">Salvar atividade</button>
            </div>
        </form>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
