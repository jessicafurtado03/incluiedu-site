<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta name="theme-color" content="#5b5bd6">
    <meta property="og:title" content="IncluiEdu | Resultados">
    <meta property="og:description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/professora-ajudando-aluno.jpg">
    <title>IncluiEdu | Resultados</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header class="dashboard-header">
    <a href="index.html" class="logo" aria-label="IncluiEdu - página inicial"><span>Inclui</span>Edu</a>
    <a class="btn" href="dashboard-professor.html">Dashboard</a>
</header>

<div class="dashboard">

    <aside class="sidebar" aria-label="Menu do professor">
        <a href="dashboard-professor.html">🏠 Dashboard</a>
        <a href="alunos.html">👨‍🎓 Alunos</a>
        <a href="atividades.html">📝 Atividades</a>
        <a href="adaptar-atividade.html">🧩 Adaptações</a>
        <a class="ativo" aria-current="page" href="resultados.html">📊 Resultados</a>
        <a href="materias.html">📚 Matérias</a>
        <a href="conteudos.html">💡 Conteúdos</a>
    </aside>

    <main class="dashboard-content" id="conteudo">

        <div class="dashboard-title">
            <div>
                <span>ACOMPANHAMENTO</span>
                <h1>Resultados</h1>
                <p>Registre e acompanhe o desempenho dos alunos.</p>
            </div>
        </div>

        <section class="dashboard-card">
            <h2>Resumo</h2>
            <div id="resumoResultados"></div>
        </section>

        <section class="dashboard-card">
            <h2>Registrar resultado</h2>
            <form id="formResultado" class="form-grid">
                <div>
                    <label for="resultadoAluno">Aluno</label>
                    <select id="resultadoAluno" required></select>
                </div>
                <div>
                    <label for="resultadoAtividade">Atividade</label>
                    <select id="resultadoAtividade" required></select>
                </div>
                <div class="form-full">
                    <label for="resultadoNivel">Resultado</label>
                    <select id="resultadoNivel">
                        <option value="independente">🟢 Concluiu sozinho</option>
                        <option value="auxilio">🟡 Concluiu com auxílio</option>
                        <option value="nao-concluiu">🔴 Não conseguiu concluir</option>
                    </select>
                </div>
                <div class="form-full">
                    <label for="resultadoObservacao">Observação</label>
                    <textarea id="resultadoObservacao" rows="5" placeholder="Registre suas observações: o que ajudou, o que pode melhorar..."></textarea>
                </div>
                <div class="form-full">
                    <button class="btn" type="submit">Salvar resultado</button>
                </div>
            </form>
        </section>

        <section class="dashboard-card">
            <h2>Histórico</h2>
            <div id="listaResultados"></div>
        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
