<body class="pagina-login" data-pagina="login">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div class="login-container">

    <a href="index.html" class="logo" aria-label="IncluiEdu - página inicial"><span>Inclui</span>Edu</a>

    <main class="login-card" id="conteudo">
        <div class="login-arte" aria-hidden="true">
        <svg viewBox="0 0 320 260" role="presentation">
            <circle cx="160" cy="130" r="118" fill="#eef0ff"/>
            <rect x="70" y="60" width="180" height="140" rx="22" fill="#fff" stroke="#c9ccf5" stroke-width="3"/>
            <rect x="92" y="84" width="40" height="40" rx="12" fill="#5b54e8"/><text x="112" y="111" text-anchor="middle" font-size="22" fill="#fff" font-family="Arial" font-weight="bold">1</text>
            <rect x="142" y="92" width="86" height="10" rx="5" fill="#c9ccf5"/><rect x="142" y="108" width="60" height="10" rx="5" fill="#e4e6fb"/>
            <rect x="92" y="136" width="40" height="40" rx="12" fill="#18b6a4"/><text x="112" y="163" text-anchor="middle" font-size="22" fill="#fff" font-family="Arial" font-weight="bold">2</text>
            <rect x="142" y="144" width="86" height="10" rx="5" fill="#c9ccf5"/><rect x="142" y="160" width="48" height="10" rx="5" fill="#e4e6fb"/>
            <path d="M250 52 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#ffc542"/>
            <circle cx="62" cy="196" r="14" fill="#ff8a65"/><circle cx="270" cy="200" r="9" fill="#18b6a4"/>
        </svg>
    </div>
        <span class="login-label">BEM-VINDO DE VOLTA</span>
        <h1>Entre na sua conta</h1>
        <p>Entre com seu e-mail ou usuário e sua senha.</p>

        <form id="formLogin">
            <label for="email">E-mail ou usuário</label>
            <input type="text" id="email" placeholder="seuemail@email.com" required autocomplete="username" autocapitalize="none">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
            <button class="btn btn-full" type="submit">Entrar</button>
        </form>

        <p id="mensagemLogin" class="mensagem" role="alert"></p>

        <div class="login-footer">
            <span>Ainda não tem conta?</span>
            <a href="cadastro.html">Criar conta</a>
        </div>
        <p class="dica">Aluno: crie sua conta em <a href="cadastro.html?tipo=aluno">Criar conta → Aluno</a> ou peça ao seu professor um usuário e senha.</p>
    </main>

    <p style="text-align:center;margin-top:18px"><a href="index.html">← Voltar para o site</a></p>
