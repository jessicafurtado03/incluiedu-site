<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header class="dashboard-header">

    <a href="atividades.html">← Atividades</a>
</header>

<main class="form-page" id="conteudo">
    <section class="dashboard-card">
        <span>ADAPTAÇÃO PEDAGÓGICA</span>
        <h1>Adaptar atividade</h1>
        <p>Selecione uma atividade e um aluno para receber sugestões de adaptação baseadas no perfil.</p>

        <form id="formAdaptacao">
            <label for="atividadeSelecionada">Atividade</label>
            <select id="atividadeSelecionada" required></select>
            <label for="alunoSelecionado">Aluno</label>
            <select id="alunoSelecionado" required></select>
            <button class="btn" type="submit">✨ Gerar sugestões</button>
        </form>
        <p class="dica" style="margin-top:12px">Não encontrou? <a href="nova-atividade.html">Criar atividade</a> • <a href="alunos.html">Cadastrar aluno</a></p>
    </section>

    <section id="resultadoAdaptacao" class="dashboard-card" style="display:none;" aria-live="polite"></section>
</main>

<script src="script.js"></script>
