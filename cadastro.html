<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta name="theme-color" content="#5b54e8">
    <meta property="og:title" content="IncluiEdu | Criar conta de professor">
    <meta property="og:description" content="IncluiEdu - Assistente de Inclusão Pedagógica">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/professora-ajudando-aluno.jpg">
    <title>IncluiEdu | Criar conta de professor</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login" data-pagina="cadastro">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div class="login-container">

    <a href="index.html" class="logo" aria-label="IncluiEdu - página inicial"><span>Inclui</span>Edu</a>

    <main class="login-card" id="conteudo">
        <div class="login-arte" aria-hidden="true">
        <svg viewBox="0 0 320 260" role="presentation">
            <circle cx="160" cy="130" r="118" fill="#eef0ff"/>
            <rect x="70" y="60" width="180" height="140" rx="22" fill="#fff" stroke="#c9ccf5" stroke-width="3"/>
            <rect x="92" y="84" width="40" height="40" rx="12" fill="#5b54e8"/><text x="112" y="111" text-anchor="middle" font-size="22" fill="#fff" font-family="Arial" font-weight="bold">1</text>
            <rect x="142" y="92" width="86" height="10" rx="5" fill="#c9ccf5"/><rect x="142" y="108" width="60" height="10" rx="5" fill="#e4e6fb"/>
            <rect x="92" y="136" width="40" height="40" rx="12" fill="#18b6a4"/><text x="112" y="163" text-anchor="middle" font-size="22" fill="#fff" font-family="Arial" font-weight="bold">2</text>
            <rect x="142" y="144" width="86" height="10" rx="5" fill="#c9ccf5"/><rect x="142" y="160" width="48" height="10" rx="5" fill="#e4e6fb"/>
            <path d="M250 52 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#ffc542"/>
            <circle cx="62" cy="196" r="14" fill="#ff8a65"/><circle cx="270" cy="200" r="9" fill="#18b6a4"/>
        </svg>
    </div>
        <span class="login-label">CONTA DE PROFESSOR</span>
        <h1>Criar sua conta</h1>
        <p>Gratuito para professores. Depois, você mesmo cria o acesso de cada aluno.</p>

        <form id="formCadastro">
            <label for="nomeCadastro">Nome completo</label>
            <input type="text" id="nomeCadastro" placeholder="Ex.: Profa. Ana Ribeiro" required autocomplete="name">
            <label for="emailCadastro">E-mail</label>
            <input type="email" id="emailCadastro" placeholder="seuemail@email.com" required autocomplete="email">
            <label for="senhaCadastro">Senha</label>
            <input type="password" id="senhaCadastro" placeholder="Mínimo de 6 caracteres" required minlength="6" autocomplete="new-password">
            <label for="senhaConfirma">Confirme a senha</label>
            <input type="password" id="senhaConfirma" placeholder="Repita a senha" required minlength="6" autocomplete="new-password">
            <label class="check check-inline"><input type="checkbox" id="incluirExemplos" checked><span>Começar com alunos e atividades de exemplo (você pode excluir depois)</span></label>
            <button class="btn btn-full" type="submit">Criar conta</button>
        </form>

        <p id="mensagemCadastro" class="mensagem" role="alert"></p>
        <p class="dica">🔒 Sua senha é protegida com SHA-256 e sal. Os dados ficam salvos no banco de dados deste navegador.</p>

        <div class="login-footer">
            <span>Já possui uma conta?</span>
            <a href="login.html">Entrar</a>
        </div>
    </main>

    <p style="text-align:center;margin-top:18px"><a href="index.html">← Voltar para o site</a></p>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/dados.js"></script>
<script src="assets/js/visual.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
